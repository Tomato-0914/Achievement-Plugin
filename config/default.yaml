# 默认配置，插件更新时会被覆盖，不要改这个文件。
# 插件首次启动会把它复制成 config/config.yaml（连同注释），要改配置改那个文件，或者在锅巴里改。

# 插件优先级，数字越小越先响应（改完重启生效）。
# 默认 -110：比观测枢图鉴（Tomato-Plugin，默认 -100）靠前，#成就图鉴 这类消息不会被图鉴的模糊匹配接走
priority: -110

# #成就查漏 / #成就查询 每页显示多少个成就。默认 30，一页正好一张图；调大的话超过 render.pageHeight 会被切成多张
pageSize: 30

# 查漏、统计、录入时顺带和米游社显示的成就达成数核对，数量对不上时提醒记录可能过期了。
# 用的是 Yunzai 原神插件（plugins/genshin）的 UID 绑定和公共 Cookie，只要 #绑定uid 过就行；
# 没装原神插件或没绑 UID 时自动跳过，不提示。#成就对比 不受这个开关影响
mysCompare: true

# 查漏、查询、统计出图前先回一句「查询中，请稍等...」
renderTip: true

# 帮助、查漏、查询、统计的图片下面带按钮（只有 QQ 官方 Bot 支持，其他适配器自动不加）
buttons: true

# 每天几点（0~23）检查一次 genshin-db 有没有新成就；插件启动后也会先检查一次
syncHour: 0

# 图片渲染精度（50~300，默认 100）；数值越大图片越清晰，体积也越大
renderScale: 100

render:
  quality: 90         # JPEG 质量
  timeout: 60000      # 等待页面加载的上限（毫秒）
  pageHeight: 3500    # 图片超过这个高度会切成多张
